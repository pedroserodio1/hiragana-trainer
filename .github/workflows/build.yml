name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Run Core tests
      run: dotnet test HiraganaTrainer.Core.Tests/HiraganaTrainer.Core.Tests.csproj --configuration Release

    - name: Build plugin
      run: dotnet build HiraganaTrainer.slnx --configuration Release

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HiraganaTrainer
        path: HiraganaTrainer/bin/x64/Release/HiraganaTrainer/*
        if-no-files-found: error
        retention-days: 7
